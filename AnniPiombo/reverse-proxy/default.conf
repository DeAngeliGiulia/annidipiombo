upstream editor-frontend
{
    server editor-frontend:4201;
}

upstream editor-backend
{
    server editor-backend:5000;
}

server
{
    listen 8080;

    location /editor-frontend/editor-backend/ {
        rewrite ^/editor-frontend/editor-backend/(.*)$ /$1 break;
        proxy_pass http://editor-backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /editor-frontend/ {
        rewrite ^/editor-frontend/(.*)$ /$1 break;
        proxy_pass http://editor-frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

   
   
}